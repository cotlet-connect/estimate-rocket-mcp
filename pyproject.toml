[project]
name = "estimate-rocket-mcp"
version = "1.1.0"
description = "Connect Estimate Rocket to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Estimate Rocket API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["estimate rocket", "estimate rocket api", "estimate rocket mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/estimate-rocket-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=estimate-rocket"
Source = "https://github.com/cotlet-connect/estimate-rocket-mcp"

[project.scripts]
estimate-rocket-mcp = "estimate_rocket_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"estimate_rocket_agent.py" = "estimate_rocket_agent.py"

[tool.hatch.build.targets.sdist]
include = ["estimate_rocket_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
